spring:
  datasource:
    url: jdbc:h2:mem:toolshare_payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# T-012: MVP webhook signature verification config. The secret below is a
# local-dev-only placeholder (mirrors MvpPaymentProviderAdapter's own
# "not production-ready" framing) — a real deployment would source this from a
# secret manager instead, per ARCHITECTURE.md §14.
toolshare:
  payment:
    webhook:
      replay-tolerance: 5m
      secrets:
        MVP: "local-dev-only-placeholder-secret"
